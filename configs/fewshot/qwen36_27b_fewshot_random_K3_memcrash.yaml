# v3 mem_crash supplemental — qwen36_27b_fewshot_random_K3_memcrash
# Pair pool from committee runs (LOO contamination prevention).
api:
  backend: vllm
  model: Qwen/Qwen3.6-27B
  base_url: http://localhost:8005/v1
  temperature: 0.7
  top_p: 0.9
  max_tokens: 16384
  timeout: 300
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
experiment:
  name: qwen36_27b_fewshot_random_K3_memcrash
  method: iterative
  few_shot_strategy: random
  few_shot_k: 3
  few_shot_pair_pool_seed: 42
