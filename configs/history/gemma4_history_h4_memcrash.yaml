# v3 mem_crash supplemental — gemma4_history_h4_memcrash
# ============================================================
# Requires local vLLM serving gemma-4-31B-it on port 8005.
# v2 tasks for this model: 176 (source-self skipped)
# Output: outputs/gemma4/

api:
  backend: vllm
  model: google/gemma-4-31B-it
  base_url: "http://localhost:8006/v1"
  temperature: 0.7
  max_tokens: 16384
  timeout: 300

experiment:
  name: gemma4_history_h4_memcrash
  max_iterations: 5
  max_history_rounds: 4
  dataset_dir: "data"
  output_dir: "outputs/history/gemma4_history_h4_memcrash"
  tasks:
  - "cuda_123"
  - "cuda_151"
  - kernelbench_level1_26
  - kernelbench_level1_36
  - kernelbench_level1_37
  - kernelbench_level1_45
  - kernelbench_level1_48
  - kernelbench_level1_59
  - kernelbench_level1_60
  - kernelbench_level1_71
  - kernelbench_level1_81
  - kernelbench_level1_86
  - kernelbench_level1_92
  - kernelbench_level2_12
  - kernelbench_level2_3
  - kernelbench_level2_33

build:
  timeout: 120                # nvcc / make / pybind11 build
  test_timeout: 300           # cuda_event timing or applied-kernels ./test
  workdir: /tmp/cuda_debugger_v3_gemma4_history_h4

logging:
  level: "INFO"
  save_api_responses: true
