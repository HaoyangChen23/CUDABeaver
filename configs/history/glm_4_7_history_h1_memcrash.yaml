# v3 mem_crash supplemental — glm_4_7_history_h1_memcrash
api:
  backend: openai
  model: z-ai/glm4.7
  base_url: <CLOUD_API_BASE_URL>  # OpenAI-compatible endpoint, e.g. https://your-provider/v1
  api_key_env: CLOUD_API_KEY
  temperature: 1.0
  top_p: 1.0
  max_tokens: 65536
  timeout: 900
  stream: true
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
experiment:
  name: glm_4_7_history_h1_memcrash
  method: iterative
  max_iterations: 5
  max_history_rounds: 1
  dataset_dir: "data"
  output_dir: "outputs/history/glm_4_7_history_h1_memcrash"
  tasks:
  - "cuda_123"
  - "cuda_151"
  - kernelbench_level1_26
  - kernelbench_level1_36
  - kernelbench_level1_37
  - kernelbench_level1_45
  - kernelbench_level1_48
  - kernelbench_level1_59
  - kernelbench_level1_60
  - kernelbench_level1_71
  - kernelbench_level1_81
  - kernelbench_level1_86
  - kernelbench_level1_92
  - kernelbench_level2_12
  - kernelbench_level2_3
  - kernelbench_level2_33
build:
  workdir: /tmp/cuda_debugger_v3_glm_4_7_history_h1
  timeout: 300
  test_timeout: 300
logging:
  level: INFO
  save_api_responses: true
