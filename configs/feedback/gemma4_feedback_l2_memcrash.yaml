# v3 mem_crash supplemental — gemma4_feedback_l2_memcrash
# Levels: 0=none, 1=G, 2=G+B, 3=G+B+T (=baseline iter), 4=G+B+T+P (ncu).
api:
  backend: vllm
  model: google/gemma-4-31B-it
  base_url: http://localhost:8006/v1
  temperature: 0.7
  max_tokens: 16384
  timeout: 300
experiment:
  name: gemma4_feedback_l2_memcrash
  method: iterative
  feedback_level: 2
  max_iterations: 5
  max_history_rounds: 4
  dataset_dir: "data"
  output_dir: "outputs/feedback/gemma4_feedback_l2_memcrash"
  tasks:
  - "cuda_123"
  - "cuda_151"
  - kernelbench_level1_26
  - kernelbench_level1_36
  - kernelbench_level1_37
  - kernelbench_level1_45
  - kernelbench_level1_48
  - kernelbench_level1_59
  - kernelbench_level1_60
  - kernelbench_level1_71
  - kernelbench_level1_81
  - kernelbench_level1_86
  - kernelbench_level1_92
  - kernelbench_level2_12
  - kernelbench_level2_3
  - kernelbench_level2_33
build:
  workdir: /tmp/cuda_debugger_v3_gemma4_feedback_l2
  timeout: 300
  test_timeout: 300
logging:
  level: INFO
  save_api_responses: true
