# v3 mem_crash supplemental — minimax_m2_7_repeated_memcrash (repeated@5)
api:
  backend: openai
  model: minimaxai/minimax-m2.7
  base_url: <CLOUD_API_BASE_URL>  # OpenAI-compatible endpoint, e.g. https://your-provider/v1
  api_key_env: CLOUD_API_KEY
  temperature: 0.7
  top_p: 0.95
  max_tokens: 16384
  stream: true
  extra_body:
    chat_template_kwargs:
      thinking_budget: 1024
experiment:
  name: minimax_m2_7_repeated_memcrash
  method: repeated
  max_iterations: 5
  max_history_rounds: 4
  dataset_dir: "data"
  output_dir: "outputs/repeated/minimax_m2_7_repeated_memcrash"
  tasks:
  - "cuda_123"
  - "cuda_151"
  - kernelbench_level1_26
  - kernelbench_level1_36
  - kernelbench_level1_37
  - kernelbench_level1_45
  - kernelbench_level1_48
  - kernelbench_level1_59
  - kernelbench_level1_60
  - kernelbench_level1_71
  - kernelbench_level1_81
  - kernelbench_level1_86
  - kernelbench_level1_92
  - kernelbench_level2_12
  - kernelbench_level2_3
  - kernelbench_level2_33
build:
  timeout: 300
  test_timeout: 300
  workdir: /tmp/cuda_debugger_v3_minimax_m2_7_repeated
logging:
  level: INFO
  save_api_responses: true
